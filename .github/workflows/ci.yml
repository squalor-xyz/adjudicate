# SPDX-License-Identifier: GPL-3.0-or-later
#
# Checks every push to main and every pull request (C193): the same checks as
# AGENTS.md "Setup and checks", plus adj lint on this repo's own decisions/.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test ./...
      - name: adj lint
        run: |
          go build -o "$RUNNER_TEMP/adj" ./cmd/adj
          "$RUNNER_TEMP/adj" lint

  test-macos:
    # The ID lock (syscall.Flock) is built for darwin as well as linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
